<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Invoice {{ payment.invoice_number }}</title>
    <style>
      body { font-family: DejaVu Sans, Arial, sans-serif; }
      .header { text-align: center; margin-bottom: 20px; }
      .details { width: 100%; border-collapse: collapse; }
      .details td, .details th { border: 1px solid #ddd; padding: 8px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Ward Waste Management</h2>
      <p>Invoice: {{ payment.invoice_number }} — {{ payment.month|date:'F Y' }}</p>
    </div>
    <table class="details">
      <tr><th>User</th><td>{{ payment.user.get_full_name }} ({{ payment.user.email }})</td></tr>
      <tr><th>Amount</th><td>₹{{ payment.amount }}</td></tr>
      <tr><th>Status</th><td>{% if payment.paid %}Paid{% else %}Due{% endif %}</td></tr>
      <tr><th>Generated</th><td>{{ payment.created_at }}</td></tr>
    </table>
  </body>
</html>
